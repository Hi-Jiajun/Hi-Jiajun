  </text>
  <text x="68" y="124" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">
    Systems, kernels,
  </text>
  <text x="68" y="178" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">
    dataplane &amp; AI tooling
  </text>
  <text x="68" y="218" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="19">

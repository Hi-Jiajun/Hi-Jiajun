  </text>

  <g transform="translate(940 60)">
    <rect width="268" height="140" rx="22" fill="rgba(15,23,42,0.04)"/>
    <rect x="0.75" y="0.75" width="266.5" height="138.5" rx="21.25" stroke="rgba(15,23,42,0.12)"/>
    <rect x="24" y="24" width="68" height="8" rx="4" fill="#0284C7"/>
    <rect x="24" y="46" width="164" height="10" rx="5" fill="#0284C7" fill-opacity="0.85"/>
    <rect x="24" y="70" width="116" height="8" rx="4" fill="#0D9488"/>
    <rect x="24" y="92" width="204" height="10" rx="5" fill="#0D9488" fill-opacity="0.75"/>
    <text x="24" y="124" fill="#0369A1" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="600">

  email: "3138947285@qq.com"
  header_intro_zh: "🛠️ 把 GitHub 与个人博客当作公开工作台：维护从零编写、并在真机或真实流媒体/网络环境下验证的工程项目——每个仓库都写清「已实测通过」与「尚未验证」的边界。"
  header_intro_en: "GitHub & my blog as a public workbench: systems projects built from scratch and verified on real hardware, documenting clearly what is measured vs. open."
  footer_zh: "✨ 先做对自己有用的东西，也希望它们对别人有用。"
  footer_en: "Building things useful to me first, and hopefully useful to others too."


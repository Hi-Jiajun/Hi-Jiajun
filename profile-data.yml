profile:
  username: Hi-Jiajun
  display_name: "KiLiminal"
  blog_url: "https://hi-jiajun.github.io"
  rss_url: "https://hi-jiajun.github.io/rss.xml"
  max_blog_posts: 5
  email: "3138947285@qq.com"
  header_title: "Hi, I'm Hi-Jiajun 👋"
  header_role_zh: "学生 & 个人开发者 · 数据面、内核驱动与系统实验"
  header_role_en: "Student & solo builder · dataplane, kernel drivers & systems experiments"
  header_intro_zh: "🛠️ 我把 GitHub 和个人博客当成公开工作台，维护从零编写、在真实硬件上反复验证的项目：用户态网络数据面、macOS/Android 内核与驱动适配、GPU 计算模拟以及 AI 工具链。"
  header_intro_en: "I treat GitHub and my blog as a public workbench for projects built from scratch and verified on real hardware: user-space dataplanes, macOS/Android kernel & driver bring-up, GPU compute emulation, and AI tooling."
  ownership_note_zh: "ℹ️ 仓库里既有原创工程与实机研究档案，也有用于学习和向上游提交 PR 的 fork；每个项目都尽量写清「已实测通过」与「尚未验证」的边界。"
  ownership_note_en: "Some repos are original engineering or single-machine hardware research; others are forks for study and upstream PRs, each documenting what is measured vs. open."
  footer_zh: "✨ 先做对自己有用的东西，也希望它们对别人有用。"
  footer_en: "Building things useful to me first, and hopefully useful to others too."

about:
  - icon: "🌐"
    zh: "用户态网络数据面：FD.io VPP 的 PPPoE 客户端插件与高性能路由器系统原型"
    en: "User-space dataplane: FD.io VPP PPPoE client plugin & VPP-based router prototypes"
  - icon: "🍎"
    zh: "macOS 内核驱动移植：IO80211 原生 MT792x Wi-Fi、ConnectX-3 Pro IOKit 驱动与 Zen 5 适配档案"
    en: "macOS driver bring-up: native IO80211 MT792x Wi-Fi, ConnectX-3 Pro IOKit port & Zen 5 notes"
  - icon: "📱"
    zh: "移动 SoC 与无线边界：小米 15S Pro (XRING O1) 设备树还原、6.18 KMI 门禁与 MT6639 研究"
    en: "Mobile SoC & wireless lab: Xiaomi 15S Pro (XRING O1) DTS/KMI gates & MT6639 Wi-Fi 7 research"
  - icon: "🧪"
    zh: "GPU 计算与 AI 网关：Vulkan 上的 Metal 计算 API 实验、多 Key 路由网关与自动化脚本"
    en: "GPU & AI tooling: Metal-on-Vulkan compute experiments, API key router & agent workflows"
  - icon: "✍️"
    zh: "公开记录：长篇拆解与实机踩坑同步沉淀在个人博客 hi-jiajun.github.io"
    en: "Writing: deeper hardware notes & architecture breakdowns live on hi-jiajun.github.io"


          language: "Rust / Svelte"
          note_zh: "基于 FD.io VPP 的高性能路由器系统原型"
          note_en: "High-performance open-source router system built on VPP"
    - title_zh: "🍎 内核驱动与硬件适配"
      title_en: "Kernel Drivers & Bring-up"
      items:
        - repo: "AirportMtk-macOS"
          tag: "📶 KEXT"
          language: "C++"
          note_zh: "MT792x 原生 IO80211 Wi-Fi 驱动"
          note_en: "IO80211-family macOS Wi-Fi driver for MT7921/MT7922/RZ616"
        - repo: "ConnectX3-macOS"
          tag: "⚡ KEXT"
          language: "C++"
          note_zh: "ConnectX-3 Pro 原生 IOKit 驱动移植"
          note_en: "FreeBSD mlx4 hardware layer ported to macOS IOKit (10GbE)"
    - title_zh: "📱 移动 SoC 与无线边界"
      title_en: "Mobile SoC & Wireless Lab"
      items:
        - repo: "dijun-kernel-devicetree"
          tag: "🧩 KERNEL / DTS"
          language: "C / DTS"
          note_zh: "小米 15S Pro 设备树与 6.18 KMI 底座"
          note_en: "Xiaomi 15S Pro device trees, ABI gates & 6.18.32-4k extmod SDK"
        - repo: "mt6639-wifi7-dijun"
          tag: "📡 WI-FI 7"
          language: "Python / C"
          note_zh: "小米 15S Pro MT6639 Wi-Fi 7 研究"
          note_en: "MT6639 Wi-Fi 7 & Bluetooth capability research on Dijun"
    - title_zh: "🧪 GPU 计算与 AI 网关"
      title_en: "GPU Compute & AI Tooling"
      items:
        - repo: "metal-api-emulator"
          tag: "🦀 GPU / VULKAN"
          language: "Rust"
          note_zh: "在 Vulkan 上复刻 Metal 计算 API 与一致性对比"
          note_en: "Host-side Metal compute API prototype with Vulkan executor"
        - repo: "tavily-router"
          tag: "🤖 AI GATEWAY"
          language: "Python"
          note_zh: "多 Key 汇聚的 Tavily MCP / REST 智能路由网关"
          note_en: "Credit-aware multi-key Tavily gateway with MCP & REST"

profile:
  username: Hi-Jiajun
  header_title: "Hi, I'm Hi-Jiajun 👋"
  header_role_zh: "个人开发者 · 数据面与系统实验"
  header_role_en: "Solo builder · dataplane & systems experiments"
  header_intro_zh: "🛠️ 我把 GitHub 当成公开工作台，在这里维护自己从零写起、而且还在用的项目：用户态网络数据面、系统与 GPU 实验、能省掉重复劳动的 AI 工作流。"
  header_intro_en: "I use GitHub as a public workbench for the things I build from scratch and still use: user-space dataplane, systems and GPU experiments, and AI workflows that remove repeated work."
  ownership_note_zh: "ℹ️ 仓库里既有我从零写的项目，也有学习和适配用的 fork。"
  ownership_note_en: "Some repos are original work; others are forks I study and adapt."
  footer_zh: "✨ 先做对自己有用的东西，也希望它们对别人有用。"
  footer_en: "Building things useful to me first, and hopefully useful to others too."

about:
  - icon: "🌐"
    zh: "用户态数据面：FD.io VPP 的 PPPoE 插件，从协议状态机做到性能验证"
    en: "User-space dataplane: a PPPoE plugin for FD.io VPP, from protocol state machine to performance benchmarks"
  - icon: "🧪"
    zh: "系统与 GPU 实验：在 Vulkan 上复刻 Metal 计算 API，对比行为与精度差异"
    en: "Systems and GPU experiments: reproducing the Metal compute API on Vulkan and comparing parity"
  - icon: "🤖"
    zh: "AI 工作流：Agent 工具、MCP 集成，把重复劳动写成脚本"
    en: "AI workflows: agent tooling, MCP integration, and scripting away repeated work"
  - icon: "🤝"
    zh: "靠 fork、适配，偶尔给上游提 PR 来学习"
    en: "Learning by forking, adapting, and sending the occasional upstream PR"

